# Arthur Play — configurazione Redis
# Vincolo 3: Redis gira SENZA persistenza su disco.
# Lo stato delle sessioni è volatile per scelta: nessun RDB, nessun AOF, nessun backup.

# Disattiva gli snapshot RDB
save ""
# Disattiva l'Append Only File
appendonly no

bind 127.0.0.1
port 6379
protected-mode yes
# Nessun file di dump da caricare all'avvio
dbfilename ""
